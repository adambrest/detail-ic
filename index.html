<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Participant lists, scores, and redetailing. Works offline."
    />
    <title>Detail IC</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="icons/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="icons/favicon-48.png"
      sizes="48x48"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>
        <img
          class="logo"
          src="icons/logo-96.png"
          alt=""
          width="32"
          height="32"
        /><span class="title-text">Detail IC</span>
      </h1>
      <span class="version" id="app-version"></span>
      <nav id="tabs" aria-label="Tabs"></nav>
      <div class="topright">
        <button
          class="update-msg"
          id="update"
          title="A new version is ready — tap to update"
          hidden
        >
          Update available
        </button>
        <a
          class="feedback"
          href="https://github.com/adambrest/detail-ic"
          target="_blank"
          rel="noopener noreferrer"
          title="View the source code and README"
          aria-label="GitHub"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 7-5 5 5 5M16 7l5 5-5 5" /></svg
          ><span>GitHub</span></a
        >
        <a
          class="feedback"
          href="https://github.com/adambrest/detail-ic/issues/new?labels=bug&amp;title=Bug%3A%20&amp;body=What%20happened%3A%0A%0AWhat%20you%20expected%3A%0A%0AWhat%20you%20entered%20or%20tapped%3A%0A%0ADevice%20and%20browser%3A%0A"
          target="_blank"
          rel="noopener noreferrer"
          title="Report a bug on GitHub (sign-in required)"
          aria-label="Report a bug"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 7a3 3 0 0 1 6 0M8 9h8v6a4 4 0 0 1-8 0zM12 11v7M4 13h4M16 13h4M5 8l3 2M19 8l-3 2M5 19l3-2M19 19l-3-2"
            /></svg
          ><span>Report a bug</span></a
        >
      </div>
    </header>
    <div id="storage-warning" role="alert" hidden></div>
    <div id="scroll"><main id="main"></main></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status"></div>
    <script src="version.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
