<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Participant lists, scores, and redetailing. Works offline."
    />
    <title>Detail IC</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1><img class="logo" src="icons/logo-96.png" alt="" width="32" height="32" />Detail IC</h1>
      <span class="version" id="app-version"></span>
      <nav id="tabs" aria-label="Tabs"></nav>
      <span id="status" role="status">Saved on device</span>
      <button class="update-msg" id="update" title="A new version is ready — tap to update" hidden>Update available</button>
      <div class="links">
        <a class="link" href="https://github.com/adambrest/detail-ic" target="_blank" rel="noopener noreferrer" title="View the source code and README">GitHub</a>
        <a class="link" href="https://github.com/adambrest/detail-ic/issues/new?title=Detail%20IC%20feedback&amp;body=Describe%20your%20feedback%20here%3A%0A" target="_blank" rel="noopener noreferrer" title="Send feedback through GitHub (sign-in required)">Feedback</a>
      </div>
    </header>
    <div id="storage-warning" role="alert" hidden></div>
    <main id="main"></main>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status"></div>
    <script src="version.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
