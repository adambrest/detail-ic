<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Participant lists, scores, and redetailing. Works offline."
    />
    <title>Detail IC</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="icons/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="icons/favicon-48.png"
      sizes="48x48"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>
        <img
          class="logo"
          src="icons/logo-96.png"
          alt=""
          width="32"
          height="32"
        />Detail IC
      </h1>
      <span class="version" id="app-version"></span>
      <nav id="tabs" aria-label="Tabs"></nav>
      <div class="topright">
        <button
          class="update-msg"
          id="update"
          title="A new version is ready — tap to update"
          hidden
        >
          Update available
        </button>
        <a
          class="feedback icon"
          href="https://github.com/adambrest/detail-ic/issues/new?title=Detail%20IC%20feedback&amp;body=Describe%20your%20feedback%20here%3A%0A"
          target="_blank"
          rel="noopener noreferrer"
          title="Send feedback through GitHub (sign-in required)"
          aria-label="Send feedback through GitHub"
        >
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M4.72.22a.75.75 0 0 1 1.06 0l1 .999a3.488 3.488 0 0 1 2.441 0l.999-1a.748.748 0 0 1 1.265.332.75.75 0 0 1-.205.729l-.775.776c.616.63.995 1.493.995 2.444v.327c0 .1-.009.197-.025.292.408.14.764.392 1.029.722l1.968-.787a.75.75 0 0 1 .556 1.392L13 7.258V9h2.25a.75.75 0 0 1 0 1.5H13v.5c0 .409-.049.806-.141 1.186l2.17.868a.75.75 0 0 1-.557 1.392l-2.184-.873A4.997 4.997 0 0 1 8 16a4.997 4.997 0 0 1-4.288-2.427l-2.183.873a.75.75 0 0 1-.558-1.392l2.17-.868A5.036 5.036 0 0 1 3 11v-.5H.75a.75.75 0 0 1 0-1.5H3V7.258L.971 6.446a.75.75 0 0 1 .558-1.392l1.967.787c.265-.33.62-.583 1.03-.722a1.677 1.677 0 0 1-.026-.292V4.5c0-.951.38-1.814.995-2.444L4.72 1.28a.75.75 0 0 1 0-1.06Zm.53 6.28a.75.75 0 0 0-.75.75V11a3.5 3.5 0 1 0 7 0V7.25a.75.75 0 0 0-.75-.75ZM6.173 5h3.654A.172.172 0 0 0 10 4.827V4.5a2 2 0 1 0-4 0v.327c0 .096.077.173.173.173Z"
            />
          </svg>
        </a>
        <a
          class="feedback"
          href="https://github.com/adambrest/detail-ic"
          target="_blank"
          rel="noopener noreferrer"
          title="View the source code and README"
          >GitHub</a
        >
      </div>
    </header>
    <div id="storage-warning" role="alert" hidden></div>
    <main id="main"></main>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status"></div>
    <script src="version.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
